name: PR quality gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check storefront JavaScript
        run: |
          node --check site/main.js
          node --check site/checkout-config.js
          node site/tests/checkout.test.js
      - name: Configure native tests
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build native tests
        run: cmake --build build/native --parallel 4
      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --silent --show-error https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' "$RUNNER_TEMP/zig.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build and check package
        run: |
          ./scripts/package.sh
          python3 tests/package_check.py

  windows:
    name: Windows validation
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/windows --config Release --parallel 4
      - name: Run tests
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Build package
        run: cmake --build build/windows --config Release --target neuralfx_package
      - name: Check package contents
        run: python tests/package_check.py
